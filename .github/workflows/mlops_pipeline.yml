# .github/workflows/mlops_pipeline.yml
# Vehicle Mileage MLOps — CI/CD Pipeline
# Author: Suresh D R | DV Analytics
#
# TRIGGER 1: Code change → git push → tests → docker build → ECR → EKS
# TRIGGER 2: Called by SageMaker webhook after model retraining

name: Vehicle Mileage MLOps Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual deployment'
      deploy_env:
        description: 'Deploy environment (uat/prod)'
        required: false
        default: 'prod'

env:
  AWS_REGION      : ap-south-1
  ECR_REPOSITORY  : vehicle-mileage
  EKS_CLUSTER_NAME: vehicle-mileage-cluster
  S3_BUCKET       : vehicle-mileage-project

jobs:

  # ── JOB 1: Run All Tests ────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run all 8 tests
      env:
        AWS_ACCESS_KEY_ID    : ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION           : ${{ env.AWS_REGION }}
        S3_BUCKET            : ${{ env.S3_BUCKET }}
      run: |
        echo "Running all 8 automated tests..."
        pytest tests/test_model.py -v --tb=short
        echo "All tests passed!"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: pytest-results.xml


  # ── JOB 2: Build and Push Docker Image ──────────────────────────────────
  build-and-push:
    name: Build and Push Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id    : ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region           : ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push Docker image to ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG   : ${{ github.sha }}
      run: |
        echo "Building Docker image..."
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

        echo "Pushing to ECR..."
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "Docker image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"


  # ── JOB 3: Deploy to EKS ────────────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id    : ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region           : ${{ env.AWS_REGION }}

    - name: Update kubeconfig for EKS
      run: |
        aws eks update-kubeconfig \
          --region $AWS_REGION \
          --name $EKS_CLUSTER_NAME

    - name: Replace ACCOUNT_ID in k8s YAML
      run: |
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        sed -i "s/ACCOUNT_ID/$ACCOUNT_ID/g" k8s/deployment.yml
        echo "Updated k8s/deployment.yml with Account ID: $ACCOUNT_ID"

    - name: Create AWS secrets in Kubernetes
      run: |
        kubectl create secret generic aws-secrets \
          --from-literal=aws-access-key-id=${{ secrets.AWS_ACCESS_KEY_ID }} \
          --from-literal=aws-secret-access-key=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy to EKS
      run: |
        kubectl apply -f k8s/deployment.yml
        echo "Deployment applied to EKS"

    - name: Update image tag
      env:
        ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        IMAGE_TAG   : ${{ github.sha }}
      run: |
        kubectl set image deployment/vehicle-mileage-app \
          vehicle-mileage-app=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "Image updated to: $IMAGE_TAG"

    - name: Wait for rollout to complete
      run: |
        kubectl rollout status deployment/vehicle-mileage-app \
          --timeout=300s
        echo "Rollout complete!"

    - name: Verify deployment
      run: |
        echo "Pod status:"
        kubectl get pods -l app=vehicle-mileage
        echo ""
        echo "Service status:"
        kubectl get service vehicle-mileage-service
        echo ""
        EXTERNAL_IP=$(kubectl get service vehicle-mileage-service \
          -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
        echo "App URL: http://$EXTERNAL_IP:8501"

    - name: Notify deployment success
      run: |
        echo "Deployment successful!"
        echo "Commit: ${{ github.sha }}"
        echo "Branch: ${{ github.ref }}"
        echo "Triggered by: ${{ github.actor }}"


  # ── JOB 4: Deploy to UAT (on develop branch) ────────────────────────────
  deploy-uat:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id    : ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region           : ${{ env.AWS_REGION }}

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig \
          --region $AWS_REGION \
          --name $EKS_CLUSTER_NAME

    - name: Create UAT namespace if not exists
      run: |
        kubectl create namespace uat --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy to UAT
      run: |
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        sed -i "s/ACCOUNT_ID/$ACCOUNT_ID/g" k8s/deployment-uat.yml
        kubectl apply -f k8s/deployment-uat.yml
        echo "UAT deployment complete!"
