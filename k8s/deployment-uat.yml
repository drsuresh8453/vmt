# k8s/deployment-uat.yml — Vehicle Mileage MLOps Project
# UAT environment — 1 replica only

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-mileage-uat
  namespace: uat
  labels:
    app: vehicle-mileage
    env: uat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vehicle-mileage
  template:
    metadata:
      labels:
        app: vehicle-mileage
        env: uat
    spec:
      containers:
      - name: vehicle-mileage-app
        image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/vehicle-mileage:uat
        ports:
        - containerPort: 8501
        - containerPort: 8000
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-secrets
              key: aws-access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-secrets
              key: aws-secret-access-key
        - name: AWS_REGION
          value: "ap-south-1"
        - name: S3_BUCKET
          value: "vehicle-mileage-project"
        resources:
          requests:
            memory: "256Mi"
            cpu: "125m"
          limits:
            memory: "512Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: vehicle-mileage-uat-service
  namespace: uat
spec:
  type: LoadBalancer
  selector:
    app: vehicle-mileage
  ports:
  - name: streamlit
    port: 8501
    targetPort: 8501
  - name: fastapi
    port: 8000
    targetPort: 8000
